<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social -->

    <meta property="og:url" content="https://ashfaque-rifaye.github.io/" />
    <meta property="og:site_name" content="Ashfaque Rifaye" />
    <meta property="og:title" content="Ashfaque Rifaye — AI Product Manager & Technical Business Analyst" />
    <meta
      property="og:description"
      content="9+ years shipping AI products at telecom scale — GenAI virtual assistants, conversational AI, and enterprise automation. 1.5M+ monthly interactions, $4.2M saved annually."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ashfaque Rifaye — AI Product Manager & Technical BA" />
    <meta
      name="twitter:description"
      content="9+ years shipping AI products at telecom scale. Product owner of AT&T's GenAI virtual assistant."
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ashfaque Rifaye",
        "url": "https://ashfaque-rifaye.github.io/",
        "email": "mailto:ashfaque_rifaye@outlook.com",
        "jobTitle": "AI Product Manager & Technical Business Analyst",
        "worksFor": { "@type": "Organization", "name": "AT&T Communications Services India" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Velammal Engineering College, Anna University" },
        "address": { "@type": "PostalAddress", "addressLocality": "Chennai", "addressCountry": "IN" },
        "sameAs": [
          "https://github.com/ashfaque-rifaye",
          "https://www.linkedin.com/in/ashfaque-rifaye/"
        ],
        "knowsAbout": [
          "Generative AI",
          "Conversational AI",
          "Retrieval-Augmented Generation",
          "Google CCAI",
          "Dialogflow CX",
          "Product Management",
          "Business Analysis",
          "SAFe Agile"
        ]
      }
    </script>

    <!-- Fonts: Inter (UI) + Instrument Serif (display accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />

    <!-- No-flash theme init (must run before paint) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          // dark is the default unless the user explicitly chose light
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
