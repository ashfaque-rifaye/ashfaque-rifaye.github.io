    <script>
      /* Entrance motion only when someone is watching: skipped for hidden
         tabs and reduced-motion users, and always cleared after 3s so an
         animation can never leave content hidden. */
      (function () {
        try {
          var root = document.documentElement;
          if (document.visibilityState === 'visible' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            root.classList.add('motion');
            setTimeout(function () { root.classList.remove('motion'); }, 3000);
          }
        } catch (e) {}
      })();
    </script>
